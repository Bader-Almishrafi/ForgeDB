<div class="min-h-screen bg-slate-100 text-slate-950 dark:bg-[#0d1117] dark:text-slate-100" data-testid="simple-app-shell">
  <a href="#main-content"
    class="fixed left-3 top-3 z-[100] -translate-y-20 rounded-lg bg-white px-4 py-2 text-sm font-semibold shadow-lg transition focus:translate-y-0 dark:bg-[#161b22]">
    Skip to main content
  </a>

  @if (sidebarOpen()) {
    <button type="button" aria-label="Close navigation"
      class="fixed inset-0 z-40 bg-slate-950/50 lg:hidden" (click)="closeNavigation()"></button>
  }

  <aside id="app-sidebar" data-testid="app-sidebar"
    class="fixed inset-y-0 left-0 z-50 flex w-[17rem] flex-col border-r border-slate-200 bg-white shadow-xl transition-transform duration-200 lg:translate-x-0 lg:shadow-none dark:border-[#30363d] dark:bg-[#161b22]"
    [ngClass]="sidebarOpen() ? 'translate-x-0' : '-translate-x-full'">
    <div class="flex h-18 shrink-0 items-center gap-2 border-b border-slate-200 px-5 dark:border-[#30363d]">
      <a routerLink="/home" class="flex min-w-0 flex-1 items-center gap-3 rounded-lg" (click)="closeNavigation()"
        aria-label="ForgeDB workspace">
        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-indigo-600 text-white">
          <svg viewBox="0 0 24 24" class="h-6 w-6 fill-none stroke-current" stroke-width="2" aria-hidden="true">
            <ellipse cx="12" cy="5.5" rx="7" ry="3"></ellipse>
            <path d="M5 5.5v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6M5 11.5v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"></path>
          </svg>
        </span>
        <span class="min-w-0">
          <strong class="block truncate text-lg font-bold tracking-tight">ForgeDB</strong>
          <span class="block truncate text-xs text-slate-500 dark:text-slate-400">Data workspace</span>
        </span>
      </a>
      <button type="button" class="icon-button lg:hidden" aria-label="Close navigation" (click)="closeNavigation()">
        <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current" stroke-width="2" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
      </button>
    </div>

    <div class="flex min-h-0 flex-1 flex-col overflow-y-auto p-4">
      <nav aria-label="Workspace navigation">
        <h2 class="px-3 pb-2 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Workspace</h2>
        <ul class="space-y-1">
          @for (item of workspaceItems; track item.route) {
            <li>
              <a [routerLink]="item.route" (click)="closeNavigation()"
                class="flex min-h-11 items-center gap-3 rounded-xl border border-transparent px-3 text-sm font-semibold text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-[#21262d] dark:hover:text-white"
                [ngClass]="isNavItemActive(item) ? 'border-indigo-200 bg-indigo-50 text-indigo-700 dark:border-indigo-500/30 dark:bg-indigo-500/10 dark:text-indigo-300' : ''"
                [attr.aria-current]="isNavItemActive(item) ? 'page' : null">
                <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0 fill-none stroke-current" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path [attr.d]="item.icon"></path>
                </svg>
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </nav>

      <div class="mt-auto border-t border-slate-200 pt-4 dark:border-[#30363d]">
        <button type="button" (click)="toggleTheme()"
          class="flex min-h-11 w-full items-center gap-3 rounded-xl px-3 text-left text-sm font-semibold text-slate-600 transition-colors hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-[#21262d]"
          [attr.aria-label]="themeActionLabel()">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-slate-100 dark:bg-[#21262d]">
            @if (theme() === 'dark') {
              <svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current" stroke-width="1.8" aria-hidden="true">
                <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="5"></circle>
                <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
              </svg>
            }
          </span>
          <span>{{ themeActionLabel() }}</span>
        </button>

        <div #accountArea class="relative mt-1">
          @if (userMenuOpen()) {
            <div id="account-menu"
              class="absolute bottom-14 left-0 right-0 z-10 rounded-xl border border-slate-200 bg-white p-2 shadow-xl dark:border-[#30363d] dark:bg-[#21262d]"
              role="menu" aria-label="Account actions">
              <p class="border-b border-slate-100 px-3 py-2 text-xs text-slate-500 dark:border-[#30363d] dark:text-slate-400">
                Signed in as <strong class="mt-0.5 block truncate text-slate-800 dark:text-slate-200">{{ user()?.email || displayName() }}</strong>
              </p>
              <a #firstAccountAction routerLink="/change-password" role="menuitem" (click)="closeNavigation()"
                class="mt-1 flex min-h-11 items-center rounded-lg px-3 text-sm font-medium hover:bg-slate-100 dark:hover:bg-[#30363d]">
                Change password
              </a>
              <button type="button" role="menuitem" (click)="logout()"
                class="flex min-h-11 w-full items-center rounded-lg px-3 text-left text-sm font-semibold text-rose-600 hover:bg-rose-50 dark:text-rose-400 dark:hover:bg-rose-950/30">
                Log out
              </button>
            </div>
          }

          <button #accountTrigger type="button" (click)="toggleUserMenu()"
            class="flex min-h-12 w-full min-w-0 items-center gap-3 rounded-xl px-3 text-left transition-colors hover:bg-slate-100 dark:hover:bg-[#21262d]"
            aria-haspopup="menu" aria-controls="account-menu" [attr.aria-expanded]="userMenuOpen()">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-indigo-600 text-xs font-bold text-white">{{ initials() }}</span>
            <span class="min-w-0 flex-1">
              <strong class="block truncate text-sm font-semibold">{{ displayName() }}</strong>
              <span class="block truncate text-xs text-slate-500 dark:text-slate-400">{{ user()?.role || 'User' }}</span>
            </span>
            <svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0 fill-none stroke-current text-slate-400" stroke-width="2" aria-hidden="true">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <div class="min-h-screen min-w-0 lg:pl-[17rem]">
    <header data-testid="app-header"
      class="sticky top-0 z-30 flex h-18 items-center gap-3 border-b border-slate-200 bg-white px-4 sm:px-6 lg:px-8 dark:border-[#30363d] dark:bg-[#161b22]">
      <button type="button" class="icon-button lg:hidden" (click)="toggleSidebar()" aria-label="Open navigation"
        aria-controls="app-sidebar" [attr.aria-expanded]="sidebarOpen()">
        <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current" stroke-width="1.8" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <div class="min-w-0">
        <p class="text-xs font-medium text-slate-500 dark:text-slate-400">ForgeDB workspace</p>
        <p class="truncate text-base font-semibold" data-testid="current-page-title">{{ pageTitle() }}</p>
      </div>
    </header>

    <main id="main-content" class="min-w-0 p-4 sm:p-6 lg:p-8" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
