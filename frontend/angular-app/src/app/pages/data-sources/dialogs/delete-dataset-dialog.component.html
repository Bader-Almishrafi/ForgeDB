@if (isOpen && dataset) {
  <div class="fixed inset-0 z-[80] grid place-items-center bg-slate-950/55 p-4 backdrop-blur-[2px]" (click)="onBackdropClick($event)">
    <section class="dialog-panel w-full max-w-md p-6" appDialogFocusTrap role="dialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-description">
      <h2 id="delete-title" class="text-xl font-bold">Delete {{ dataset.tableName }}?</h2>
      <p id="delete-description" class="mt-2 text-sm text-slate-500">
        This permanently removes the dataset and its version history from this project. It cannot be undone.
      </p>
      @if (deleteError()) { <p class="alert alert-error mt-4" role="alert">{{ deleteError() }}</p> }
      <div class="mt-6 flex justify-end gap-3">
        <button #initialFocus type="button" class="btn-secondary" (click)="close()" [disabled]="deleting()">Cancel</button>
        <button type="button" class="btn-danger" data-testid="confirm-delete-dataset" (click)="deleteDataset()" [disabled]="deleting()">{{ deleting() ? 'Deleting…' : 'Delete dataset' }}</button>
      </div>
    </section>
  </div>
}
